<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КРОССЛОВ — Играй в слова</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div class="container mx-auto px-4 py-8 max-w-md">
        <!-- Иконка и название игры -->
        <div class="text-center mb-8">
            <img src="icon.png" alt="КРОССЛОВ" class="w-32 h-32 rounded-3xl mx-auto mb-4 border-4 border-purple-500 shadow-lg">
            <h1 class="text-4xl font-bold text-purple-400">КРОССЛОВ</h1>
            <p class="text-gray-400 mt-2">Играй в слова, собирай звёзды!</p>
        </div>

        <!-- Ссылки -->
        <div class="space-y-4 mb-8">
            <!-- ЗАМЕНИТЕ # НА ССЫЛКУ НА RUSTORE -->
            <a href="#" class="flex items-center justify-center bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
                <i class="fas fa-shopping-bag mr-3"></i>
                Скачать в RuStore
            </a>
            <!-- ЗАМЕНИТЕ # НА ССЫЛКУ НА ВК -->
            <a href="#" class="flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
                <i class="fab fa-vk mr-3"></i>
                Мы во ВКонтакте
            </a>
        </div>

        <!-- Блок со скриншотами -->
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-center mb-4 text-purple-400">Скриншоты</h2>
            <div class="grid grid-cols-2 gap-2">
                <img src="screen1.png" alt="Скриншот 1" class="rounded-lg w-full h-auto">
                <img src="screen2.png" alt="Скриншот 2" class="rounded-lg w-full h-auto">
                <img src="screen3.png" alt="Скриншот 3" class="rounded-lg w-full h-auto">
                <img src="screen4.png" alt="Скриншот 4" class="rounded-lg w-full h-auto">
                <img src="screen5.png" alt="Скриншот 5" class="rounded-lg w-full h-auto">
                <img src="screen6.png" alt="Скриншот 6" class="rounded-lg w-full h-auto">
                <img src="screen7.png" alt="Скриншот 7" class="rounded-lg w-full h-auto">
            </div>
        </div>

        <div class="text-center mt-12 text-gray-500 text-sm">
            <p>&copy; 2026 AUGUST ltd. Все права защищены.</p>
        </div>
    </div>

</body>
</html>
